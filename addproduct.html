<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="navbar">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="addproduct.html">Add Products</a>
    <a href="orders.html">Orders</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About Us</a>
    <a href="contactus.html">Contact Us</a>
    <a href="products.html">Products</a>
</div>

<div class="cart-main"> 
    <h2>Add New Product</h2>

    <form class="product-form" id="productForm">
        <label>Product Name</label>
        <input type="text" id="productName" placeholder="Enter product name" required>

        <label>Price ($)</label>
        <input type="number" id="price" placeholder="Enter price" required>

        <label>Quantity</label>
        <input type="number" id="quantity" placeholder="Enter quantity" required>

        <label>Category</label>
        <input type="text" id="category" placeholder="Enter category" required>

        <div class="buttons">
            <button class="checkout-btn" type="submit">Add Product</button>
            <button class="reset-btn" type="reset">Reset</button>
        </div>
    </form>
</div>

<div class="footer">
    <p><b>Boutique Management System by Attiqa, Natasha & Tooba</b></p>
    <p>Email: boutique@gmail.com | Phone: 0318-2345567 | Islamabad, Pakistan</p>
</div>
<script>
const productForm = document.getElementById('productForm');

productForm.addEventListener('submit', function(e) {
  e.preventDefault();

  const name = document.getElementById('productName').value;
  const price = Number(document.getElementById('price').value);
  const quantity = Number(document.getElementById('quantity').value);
  const category = document.getElementById('category').value;

  // LocalStorage se existing array lana
  let existingProducts = JSON.parse(localStorage.getItem('products'));

  // Agar pehle se array na bane ho toh empty array initialize karein
  if (!Array.isArray(existingProducts)) {
    existingProducts = [];
  }

  const newProduct = {
    id: Date.now(),
    name: name,
    price: price,
    quantity: quantity,
    category: category
  };

  existingProducts.push(newProduct);
  localStorage.setItem('products', JSON.stringify(existingProducts));

  alert('✅ Product Added! Total Products: ' + existingProducts.length);
  productForm.reset();
});
</script>

</body>
</html>
