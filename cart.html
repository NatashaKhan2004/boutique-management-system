<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-container { 
            max-width: 800px; 
            margin: 30px auto; 
            padding: 20px; 
            background: #fff; 
            border-radius: 8px; 
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: center; }
        .remove-btn { background: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .quantity-input { width: 50px; text-align: center; }
        .grand-total { font-size: 1.3em; text-align: right; font-weight: bold; }
        
        /* Checkout Section Styling */
        .checkout-section {
            margin-top: 25px;
            padding: 20px;
            background: #fdfbf7;
            border: 1px solid #e0d6c8;
            border-radius: 8px;
        }
        .checkout-section h3 {
            margin-bottom: 15px;
            color: #4a3e3d;
            border-bottom: 2px solid #e0d6c8;
            padding-bottom: 8px;
        }
        #checkoutForm {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 450px;
        }
        #checkoutForm input, #checkoutForm textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95rem;
        }
        #checkoutForm button {
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        #checkoutForm button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="addproduct.html">Add Products</a>
    <a href="orders.html">Orders</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About Us</a>
    <a href="contactus.html">Contact Us</a>
    <a href="products.html">Products</a>
</div>

<div class="cart-container">
    <h2>Shopping Cart</h2>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Subtotal</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="cartTableBody"></tbody>
    </table>

    <div class="grand-total">
        Grand Total: $<span id="grandTotal">0</span>
    </div>

    <!-- Checkout Section -->
    <div class="checkout-section">
        <h3>Customer Details for Checkout</h3>
        <form id="checkoutForm">
            <input type="text" id="custName" placeholder="Full Name" required>
            <input type="text" id="custPhone" placeholder="Phone Number" required>
            <textarea id="custAddress" placeholder="Delivery Address" required></textarea>
            <button type="submit">Place Order</button>
        </form>
    </div>
</div>

<div class="footer">
    <p><b>Boutique Management System by Attiqa, Natasha & Tooba</b></p>
    <p>Email: boutique@gmail.com | Phone: 0318-2345567 | Islamabad, Pakistan</p>
</div>

<script>
    function renderCart() {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const tableBody = document.getElementById('cartTableBody');
        let grandTotal = 0;

        if (cart.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="5">Your cart is empty!</td></tr>`;
            document.getElementById('grandTotal').innerText = "0";
            return;
        }

        tableBody.innerHTML = cart.map((item, index) => {
            const itemTotal = item.price * item.quantity;
            grandTotal += itemTotal;

            return `
                <tr>
                    <td>${item.name}</td>
                    <td>$${item.price}</td>
                    <td>
                        <input type="number" min="1" class="quantity-input" 
                               value="${item.quantity}" 
                               onchange="updateQuantity(${index}, this.value)">
                    </td>
                    <td>$${itemTotal}</td>
                    <td>
                        <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                    </td>
                </tr>
            `;
        }).join('');

        document.getElementById('grandTotal').innerText = grandTotal;
    }

    function updateQuantity(index, newQty) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let products = JSON.parse(localStorage.getItem('products')) || [];
        
        const qtyDiff = parseInt(newQty) - cart[index].quantity;
        const productIndex = products.findIndex(p => p.id === cart[index].productId);

        if (productIndex !== -1) {
            if (qtyDiff > 0 && products[productIndex].quantity < qtyDiff) {
                alert("Not enough stock available!");
                renderCart();
                return;
            }
            products[productIndex].quantity -= qtyDiff;
            localStorage.setItem('products', JSON.stringify(products));
        }

        cart[index].quantity = parseInt(newQty);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        let products = JSON.parse(localStorage.getItem('products')) || [];

        const itemToRemove = cart[index];
        const productIndex = products.findIndex(p => p.id === itemToRemove.productId);

        // Cart se remove karne par stock wapis restore karna
        if (productIndex !== -1) {
            products[productIndex].quantity += itemToRemove.quantity;
            localStorage.setItem('products', JSON.stringify(products));
        }

        cart.splice(index, 1);
        localStorage.setItem('cart', JSON.stringify(cart));
        renderCart();
    }

    // Checkout Form Submission
    document.getElementById('checkoutForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        if (cart.length === 0) {
            alert("Your cart is empty! Add items before placing an order.");
            return;
        }

        const grandTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

        const newOrder = {
            orderId: 'ORD-' + Date.now().toString().slice(-5),
            customerName: document.getElementById('custName').value,
            phone: document.getElementById('custPhone').value,
            address: document.getElementById('custAddress').value,
            items: cart,
            total: grandTotal,
            date: new Date().toLocaleDateString()
        };

        let orders = JSON.parse(localStorage.getItem('orders')) || [];
        orders.push(newOrder);
        localStorage.setItem('orders', JSON.stringify(orders));

        localStorage.removeItem('cart');

        alert('🎉 Order placed successfully! Order ID: ' + newOrder.orderId);
        window.location.href = 'orders.html';
    });

    renderCart();
</script>

</body>
</html>
