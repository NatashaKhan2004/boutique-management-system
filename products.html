<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 30px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            width: 240px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .product-card h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .product-card p {
            margin: 5px 0;
            color: #666;
        }

        .product-card .price {
            font-weight: bold;
            color: #d9534f;
            font-size: 1.1em;
        }

        .btn-add {
            background-color: #008cba;
            color: white;
            border: none;
            padding: 8px 15px;
            margin-top: 10px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-add:hover {
            background-color: #005f73;
        }

        .btn-delete {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 8px 12px;
            margin-top: 10px;
            margin-left: 5px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background-color: #a71d2a;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="addproduct.html">Add Products</a>
    <a href="orders.html">Orders</a>
    <a href="cart.html">Cart</a>
    <a href="about.html">About Us</a>
    <a href="contactus.html">Contact Us</a>
    <a href="products.html">Products</a>
</div>

<h1 style="text-align: center; margin-top: 20px; font-family: cursive;">Our Products</h1>

<div id="productsContainer" class="products-grid"></div>

<div class="footer">
    <p><b>Boutique Management System by Attiqa, Natasha & Tooba</b></p>
    <p>Email: boutique@gmail.com | Phone: 0318-2345567 | Islamabad, Pakistan</p>
</div>

<script>
    function displayProducts() {
        const container = document.getElementById('productsContainer');
        const products = JSON.parse(localStorage.getItem('products')) || [];

        if (products.length === 0) {
            container.innerHTML = "<p style='font-size: 1.2em; font-weight: bold;'>No products added yet!</p>";
            return;
        }

        container.innerHTML = products.map(product => `
            <div class="product-card">
                <h3>${product.name}</h3>
                <p>Category: <b>${product.category}</b></p>
                <p class="price">Price: $${product.price}</p>
                <p>Available: <b>${product.quantity}</b></p>
                <button class="btn-add" onclick="addToCart(${product.id})" ${product.quantity <= 0 ? 'disabled style="background:#ccc;cursor:not-allowed;"' : ''}>
                    ${product.quantity > 0 ? 'Add to Cart' : 'Out of Stock'}
                </button>
                <button class="btn-delete" onclick="deleteProduct(${product.id})">Delete</button>
            </div>
        `).join('');
    }

    function addToCart(productId) {
        let products = JSON.parse(localStorage.getItem('products')) || [];
        const productIndex = products.findIndex(p => p.id === productId);

        if (productIndex === -1) return;

        // Stock Check
        if (products[productIndex].quantity <= 0) {
            alert("Sorry! This product is out of stock.");
            return;
        }

        // 1. Stock mein se -1 karein
        products[productIndex].quantity -= 1;
        localStorage.setItem('products', JSON.stringify(products));

        // 2. Cart mein add karein
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const existingItem = cart.find(item => item.productId === productId);

        if (existingItem) {
            existingItem.quantity += 1;
        } else {
            cart.push({
                productId: products[productIndex].id,
                name: products[productIndex].name,
                price: products[productIndex].price,
                quantity: 1
            });
        }

        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`${products[productIndex].name} added to Cart!`);

        // UI refresh karein taake updated quantity show ho
        displayProducts();
    }

    // Product ko poora delete karne ka function
    function deleteProduct(productId) {
        if (confirm("Are you sure you want to delete this product?")) {
            let products = JSON.parse(localStorage.getItem('products')) || [];
            products = products.filter(p => p.id !== productId);
            localStorage.setItem('products', JSON.stringify(products));
            displayProducts();
        }
    }

    displayProducts();
</script>

</body>
</html>
